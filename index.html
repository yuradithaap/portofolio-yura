<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Audio Classifier - Teachable Machine</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #121212;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  h1 { font-weight: 200; font-size: 2rem; margin-bottom: 10px; }
  #start-btn {
    background: #ec407a;
    color: white;
    border: none;
    border-radius: 50px;
    padding: 20px 40px;
    font-size: 18px;
    cursor: pointer;
    margin: 20px 0;
  }
  #start-btn:disabled { background: #555; cursor: not-allowed; }
  #label-container div {
    font-size: 1.2rem;
    margin: 6px 0;
    padding: 8px 16px;
    background: #1e1e1e;
    border-radius: 8px;
    width: 300px;
    text-align: left;
  }
  #status { color: #aaa; font-size: 0.9rem; margin-bottom: 10px; }
</style>
</head>
<body>

  <h1>🎤 What's this sound?</h1>
  <p id="status">Memuat model...</p>
  <button id="start-btn" disabled>Mulai Dengarkan</button>
  <div id="label-container"></div>

  <!-- Library TensorFlow.js dan Speech Commands (dipakai oleh Teachable Machine Audio) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

  <script>
    // GANTI URL INI dengan link model kamu dari Teachable Machine
    // Cara dapat: di halaman Preview, klik "Export Model" > tab "Tensorflow.js" > "Upload my model" > copy Shareable Link
    const URL = "https://teachablemachine.withgoogle.com/models/d1aHHdHMK/";

    let recognizer, labelContainer, isListening = false;

    // Sesuai dokumentasi resmi speech-commands:
    // https://github.com/tensorflow/tfjs-models/tree/master/speech-commands
    async function createModel() {
      const checkpointURL = URL + "model.json";   // topologi model
      const metadataURL = URL + "metadata.json";  // metadata model

      const recognizer = speechCommands.create(
        "BROWSER_FFT", // tipe fourier transform, tidak perlu diubah
        undefined,      // vocabulary bawaan speech commands, tidak dipakai untuk model custom
        checkpointURL,
        metadataURL
      );

      // pastikan model & metadata berhasil dimuat lewat HTTPS
      await recognizer.ensureModelLoaded();
      return recognizer;
    }

    async function init() {
      try {
        recognizer = await createModel();
        const classLabels = recognizer.wordLabels(); // ambil label kelas

        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";
        for (let i = 0; i < classLabels.length; i++) {
          labelContainer.appendChild(document.createElement("div"));
        }

        document.getElementById("status").innerText = "Model siap!";
        document.getElementById("start-btn").disabled = false;
      } catch (err) {
        document.getElementById("status").innerText = "Gagal memuat model: " + err.message;
        console.error(err);
      }
    }

    function startListening() {
      if (isListening || !recognizer) return;
      isListening = true;
      document.getElementById("start-btn").innerText = "Sedang Mendengarkan...";
      document.getElementById("start-btn").disabled = true;

      const classLabels = recognizer.wordLabels();

      // listen() menerima 2 argumen:
      // 1. callback yang dipanggil tiap kali ada suara yang dikenali
      // 2. objek konfigurasi
      recognizer.listen(
        result => {
          const scores = result.scores; // probabilitas tiap kelas

          // Debug: cek di console (F12) apakah urutan label & skor sudah benar
          console.log(classLabels.map((l, i) => l + ": " + (scores[i]*100).toFixed(1) + "%").join(" | "));

          for (let i = 0; i < classLabels.length; i++) {
            const scorePercent = scores[i] * 100;
            labelContainer.childNodes[i].innerText =
              classLabels[i] + ": " + scorePercent.toFixed(1) + "%";
            labelContainer.childNodes[i].style.display = "block";
          }

          document.getElementById("status").innerText = "Mendengarkan...";
        },
        {
          includeSpectrogram: false,
          probabilityThreshold: 0,
          invokeCallbackOnNoiseAndUnknown: true,
          overlapFactor: 0.5
        }
      );
    }

    document.getElementById("start-btn").addEventListener("click", startListening);

    init();
  </script>

</body>
</html>
